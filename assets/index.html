<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcfcfb">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a19">
  <title>dash</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" rx="4" fill="%232a78d6"/><path d="M3 10.5l3-3.5 2.5 2L13 4.5" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'>
  <link rel="stylesheet" href="/assets/uPlot.min.css">
  <style>
    :root {
      color-scheme: light;
      --series-1: #2a78d6;
      --series-2: #eb6834;
      --series-3: #1baf7a;
      --series-4: #eda100;
      --series-5: #e87ba4;
      --series-6: #008300;
      --series-7: #4a3aa7;
      --series-8: #e34948;
      --series-9: #008c95;
      --series-10: #a85c00;
      --series-11: #9b51b4;
      --series-12: #006db5;
      --series-13: #c03a78;
      --series-14: #6b8e23;
      --series-15: #b44f3b;
      --series-16: #006f5f;
      --series-17: #7357c0;
      --series-18: #ad6f00;
      --series-19: #007fbd;
      --series-20: #a13d57;
      --status-good: #0ca30c;
      --chart-surface: #fcfcfb;
      --page-background: #f9f9f7;
      --primary-text: #0b0b0b;
      --secondary-text: #52514e;
      --muted: #898781;
      --gridlines: #e1e0d9;
      --axis-stroke: #c3c2b7;
      --hairline: rgba(11,11,11,0.10);
      --card-shadow: 0 1px 2px rgba(11,11,11,0.04), 0 4px 16px rgba(11,11,11,0.04);
      --seg-shadow: inset 0 0 0 1px var(--hairline), 0 1px 2px rgba(11,11,11,0.07);
      --scrim: rgba(11,11,11,0.35);
      --topbar-h: calc(57px + env(safe-area-inset-top, 0px));
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --series-1: #3987e5;
        --series-2: #d95926;
        --series-3: #199e70;
        --series-4: #c98500;
        --series-5: #d55181;
        --series-6: #008300;
        --series-7: #9085e9;
        --series-8: #e66767;
        --series-9: #25b7c0;
        --series-10: #d38a38;
        --series-11: #c481dc;
        --series-12: #4c9ddd;
        --series-13: #e16aa2;
        --series-14: #9bbd54;
        --series-15: #dc7a64;
        --series-16: #35a895;
        --series-17: #9b85dc;
        --series-18: #d9a33e;
        --series-19: #42a9d8;
        --series-20: #d16a83;
        --chart-surface: #1a1a19;
        --page-background: #0d0d0d;
        --primary-text: #ffffff;
        --secondary-text: #c3c2b7;
        --muted: #898781;
        --gridlines: #2c2c2a;
        --axis-stroke: #383835;
        --hairline: rgba(255,255,255,0.10);
        --card-shadow: none;
        --seg-shadow: inset 0 0 0 1px var(--hairline);
        --scrim: rgba(0,0,0,0.55);
      }
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --series-1: #2a78d6;
      --series-2: #eb6834;
      --series-3: #1baf7a;
      --series-4: #eda100;
      --series-5: #e87ba4;
      --series-6: #008300;
      --series-7: #4a3aa7;
      --series-8: #e34948;
      --series-9: #008c95;
      --series-10: #a85c00;
      --series-11: #9b51b4;
      --series-12: #006db5;
      --series-13: #c03a78;
      --series-14: #6b8e23;
      --series-15: #b44f3b;
      --series-16: #006f5f;
      --series-17: #7357c0;
      --series-18: #ad6f00;
      --series-19: #007fbd;
      --series-20: #a13d57;
      --chart-surface: #fcfcfb;
      --page-background: #f9f9f7;
      --primary-text: #0b0b0b;
      --secondary-text: #52514e;
      --muted: #898781;
      --gridlines: #e1e0d9;
      --axis-stroke: #c3c2b7;
      --hairline: rgba(11,11,11,0.10);
      --card-shadow: 0 1px 2px rgba(11,11,11,0.04), 0 4px 16px rgba(11,11,11,0.04);
      --seg-shadow: inset 0 0 0 1px var(--hairline), 0 1px 2px rgba(11,11,11,0.07);
      --scrim: rgba(11,11,11,0.35);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-6: #008300;
      --series-7: #9085e9;
      --series-8: #e66767;
      --series-9: #25b7c0;
      --series-10: #d38a38;
      --series-11: #c481dc;
      --series-12: #4c9ddd;
      --series-13: #e16aa2;
      --series-14: #9bbd54;
      --series-15: #dc7a64;
      --series-16: #35a895;
      --series-17: #9b85dc;
      --series-18: #d9a33e;
      --series-19: #42a9d8;
      --series-20: #d16a83;
      --chart-surface: #1a1a19;
      --page-background: #0d0d0d;
      --primary-text: #ffffff;
      --secondary-text: #c3c2b7;
      --muted: #898781;
      --gridlines: #2c2c2a;
      --axis-stroke: #383835;
      --hairline: rgba(255,255,255,0.10);
      --card-shadow: none;
      --seg-shadow: inset 0 0 0 1px var(--hairline);
      --scrim: rgba(0,0,0,0.55);
    }

    * { box-sizing: border-box; }

    html { height: 100%; }

    body, button, input {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      height: 100vh;
      height: 100dvh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--page-background);
      color: var(--primary-text);
      overflow: hidden;
    }

    button {
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--chart-surface);
      color: var(--secondary-text);
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 8px 11px;
    }

    button:hover { color: var(--primary-text); border-color: var(--axis-stroke); }

    :focus-visible {
      outline: 2px solid var(--series-1);
      outline-offset: 2px;
    }

    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--hairline);
      padding: env(safe-area-inset-top, 0px) 16px 0;
      padding-left: calc(16px + env(safe-area-inset-left, 0px));
      padding-right: calc(16px + env(safe-area-inset-right, 0px));
      min-height: var(--topbar-h);
      background: var(--chart-surface);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      padding: 0;
    }

    .icon-btn svg { display: block; }

    #menu-toggle { display: none; position: relative; }

    #menu-count {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 15px;
      height: 15px;
      padding: 0 3px;
      border-radius: 999px;
      background: var(--series-1);
      color: #ffffff;
      font-size: 10px;
      font-weight: 650;
      line-height: 15px;
      text-align: center;
    }

    #menu-count[hidden] { display: none; }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-right: 8px;
    }

    .brand-mark {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      background: var(--series-1);
    }

    .seg {
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--hairline);
      border-radius: 9px;
      background: var(--page-background);
    }

    .seg button {
      border: 0;
      border-radius: 6px;
      background: transparent;
      padding: 6px 11px;
      white-space: nowrap;
    }

    .seg button:hover { color: var(--primary-text); }

    .seg button.active {
      background: var(--chart-surface);
      box-shadow: var(--seg-shadow);
      color: var(--primary-text);
      font-weight: 600;
    }

    .spacer { flex: 1; }

    #live-toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 999px;
      padding: 8px 13px;
      white-space: nowrap;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex: 0 0 auto;
    }

    #live-toggle[aria-pressed="true"] { color: var(--primary-text); }
    #live-toggle[aria-pressed="true"] .live-dot {
      background: var(--status-good);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    @media (prefers-reduced-motion: reduce) {
      .live-dot { animation: none !important; }
      aside, #scrim, .disclosure { transition: none !important; }
    }

    #theme-toggle .theme-icon-sun { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) #theme-toggle .theme-icon-sun { display: block; }
      :root:not([data-theme="light"]) #theme-toggle .theme-icon-moon { display: none; }
    }
    :root[data-theme="dark"] #theme-toggle .theme-icon-sun { display: block; }
    :root[data-theme="dark"] #theme-toggle .theme-icon-moon { display: none; }

    .layout {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
    }

    aside {
      overflow-y: auto;
      border-right: 1px solid var(--hairline);
      padding: 16px 12px calc(16px + env(safe-area-inset-bottom, 0px));
      padding-left: calc(12px + env(safe-area-inset-left, 0px));
    }

    .sidebar-title {
      color: var(--secondary-text);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.06em;
      margin: 0 4px 10px;
      text-transform: uppercase;
    }

    .sidebar-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 2px 10px;
    }

    #series-filter {
      min-width: 0;
      width: 100%;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--chart-surface);
      color: var(--primary-text);
      font-size: 13px;
      padding: 8px 10px;
    }

    #series-filter::placeholder { color: var(--muted); }
    #selected-count { color: var(--muted); font-size: 11px; white-space: nowrap; }
    #series-list { display: grid; gap: 1px; }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      border-radius: 6px;
      color: var(--secondary-text);
      cursor: pointer;
      font-size: 13px;
      min-width: 0;
      padding: 4px 6px;
    }

    .tree-row:hover { background: var(--hairline); }
    .leaf-row.checked { color: var(--primary-text); }
    .leaf-row.capped { cursor: not-allowed; opacity: 0.45; }
    .branch-row { color: var(--primary-text); user-select: none; }

    .leaf-row input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: 0;
      opacity: 0;
      pointer-events: none;
    }

    .leaf-row input:focus-visible ~ .slot-dot {
      outline: 2px solid var(--series-1);
      outline-offset: 2px;
    }

    .disclosure {
      color: var(--muted);
      flex: 0 0 auto;
      font-size: 10px;
      transition: transform 120ms ease;
      width: 9px;
    }
    .disclosure.expanded { transform: rotate(90deg); }
    .leaf-count { color: var(--muted); font-size: 11px; margin-left: auto; padding-left: 6px; }
    .series-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .slot-dot {
      border: 1.5px solid var(--axis-stroke);
      border-radius: 50%;
      flex: 0 0 auto;
      height: 10px;
      width: 10px;
      background: transparent;
    }

    #series-hint {
      color: var(--muted);
      font-size: 12px;
      margin: 10px 6px 0;
      min-height: 18px;
    }

    main {
      min-width: 0;
      min-height: 0;
      display: flex;
      padding: 16px;
      padding-right: calc(16px + env(safe-area-inset-right, 0px));
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    }

    #chart-shell {
      position: relative;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      max-width: 1760px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid var(--hairline);
      border-radius: 12px;
      background: var(--chart-surface);
      box-shadow: var(--card-shadow);
      padding-top: 10px;
    }

    #chart {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      font-variant-numeric: tabular-nums;
    }

    #empty {
      position: absolute;
      inset: 0;
      display: none;
      place-content: center;
      justify-items: center;
      padding: 24px;
      text-align: center;
      color: var(--secondary-text);
      background: var(--chart-surface);
    }

    #empty.visible { display: grid; }
    #empty p { margin: 0 0 14px; max-width: 46ch; }

    #empty svg {
      display: block;
      margin-bottom: 14px;
      color: var(--axis-stroke);
    }

    #empty code {
      max-width: 100%;
      overflow-wrap: anywhere;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--page-background);
      color: var(--primary-text);
      font-size: 12px;
      line-height: 1.5;
      padding: 10px 12px;
      text-align: left;
    }

    .uplot { background: transparent; }

    #chart .u-legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2px 16px;
      width: 100%;
      margin-top: 4px;
      padding: 8px 14px;
      border-top: 1px solid var(--hairline);
      font: 12px system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--secondary-text);
      text-align: left;
    }

    #chart .u-legend tbody { display: contents; }
    #chart .u-legend tr { display: inline-flex; align-items: center; gap: 6px; }
    #chart .u-legend th, #chart .u-legend td { padding: 0; font-weight: 400; }
    #chart .u-legend th { display: inline-flex; align-items: center; gap: 6px; }
    #chart .u-legend th::after { content: none; }
    #chart .u-legend .u-label { color: var(--secondary-text); }
    #chart .u-legend .u-value {
      color: var(--primary-text);
      font-variant-numeric: tabular-nums;
      min-width: 5ch;
    }
    #chart .u-legend .u-marker {
      width: 10px;
      height: 10px;
      border-width: 5px;
      border-radius: 3px;
    }
    #chart .u-legend tr.u-off { opacity: 0.4; }

    #scrim {
      display: none;
      position: fixed;
      top: var(--topbar-h);
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 20;
      background: var(--scrim);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    @media (max-width: 720px) {
      .topbar {
        gap: 8px;
        padding-left: calc(10px + env(safe-area-inset-left, 0px));
        padding-right: calc(10px + env(safe-area-inset-right, 0px));
      }
      .brand { margin-right: 0; }
      .seg button { padding: 6px 9px; }
      #live-toggle span:not(.live-dot) { display: none; }
      #live-toggle { padding: 8px; width: 34px; height: 34px; justify-content: center; }
      #menu-toggle { display: inline-flex; }
      .layout { grid-template-columns: minmax(0, 1fr); }
      #scrim { display: block; }
      body.drawer-open #scrim { opacity: 1; pointer-events: auto; }
      aside {
        position: fixed;
        top: var(--topbar-h);
        bottom: 0;
        left: 0;
        z-index: 30;
        width: min(320px, 86vw);
        background: var(--chart-surface);
        box-shadow: 0 8px 32px rgba(0,0,0,0.25);
        transform: translateX(-108%);
        transition: transform 200ms ease;
      }
      body.drawer-open aside { transform: none; }
      main { padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
      #chart-shell { border-radius: 10px; }
      #chart .u-legend { gap: 2px 12px; padding: 7px 10px; }
    }

    @media (max-width: 420px) {
      .topbar { gap: 6px; }
    }

    @media (max-width: 359px) {
      .brand-text { display: none; }
    }

    @media (min-width: 1440px) {
      .layout { grid-template-columns: 280px minmax(0, 1fr); }
      main { padding: 20px 24px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
    }

    @media (pointer: coarse) {
      .tree-row { min-height: 44px; }
      button { min-height: 40px; }
      .icon-btn, #live-toggle { min-height: 40px; }
      .icon-btn { width: 40px; height: 40px; }
      .seg button { min-height: 32px; }
      #series-filter { padding: 10px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <button id="menu-toggle" class="icon-btn" type="button" aria-label="Toggle series panel" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <path d="M2 4h12M2 8h12M2 12h12"/>
      </svg>
      <span id="menu-count" hidden></span>
    </button>
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-text">dash</span></div>
    <div class="seg" role="group" aria-label="Time range">
      <button class="range" data-minutes="5">5m</button>
      <button class="range active" data-minutes="15">15m</button>
      <button class="range" data-minutes="60">1h</button>
      <button class="range" data-minutes="180">3h</button>
    </div>
    <div class="spacer"></div>
    <button id="live-toggle" type="button" aria-pressed="true" aria-label="Toggle auto-refresh">
      <span class="live-dot" aria-hidden="true"></span><span>live</span>
    </button>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle light and dark theme">
      <svg class="theme-icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13.5 9.5a5.5 5.5 0 0 1-7-7 5.5 5.5 0 1 0 7 7Z"/>
      </svg>
      <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
        <circle cx="8" cy="8" r="3.2"/>
        <path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M12.8 3.2l-1.1 1.1M4.3 11.7l-1.1 1.1"/>
      </svg>
    </button>
  </header>
  <div class="layout">
    <aside id="sidebar">
      <h2 class="sidebar-title">Series</h2>
      <div class="sidebar-tools">
        <input id="series-filter" type="search" placeholder="Filter…" aria-label="Filter series">
        <span id="selected-count">0 selected</span>
      </div>
      <div id="series-list"></div>
      <div id="series-hint"></div>
    </aside>
    <main>
      <div id="chart-shell">
        <div id="chart"></div>
        <div id="empty"></div>
      </div>
    </main>
  </div>
  <div id="scrim"></div>
  <script src="/assets/uPlot.iife.min.js"></script>
  <script>
    const state = {
      names: [],
      selected: new Map(),
      rangeMinutes: 15,
      chart: null,
      requestGeneration: 0,
      didAutoSelect: false,
      seriesLoaded: false,
      expansionInitialized: false,
      tree: null,
      expanded: new Set(),
      filter: "",
      legendExtra: null,
    };

    const listEl = document.querySelector("#series-list");
    const hintEl = document.querySelector("#series-hint");
    const filterEl = document.querySelector("#series-filter");
    const selectedCountEl = document.querySelector("#selected-count");
    const menuCountEl = document.querySelector("#menu-count");
    const menuBtn = document.querySelector("#menu-toggle");
    const scrimEl = document.querySelector("#scrim");
    const chartEl = document.querySelector("#chart");
    const shellEl = document.querySelector("#chart-shell");
    const emptyEl = document.querySelector("#empty");
    const liveBtn = document.querySelector("#live-toggle");
    const root = document.documentElement;
    const MAX_SELECTED_SERIES = 20;

    function color(slot) {
      return getComputedStyle(root).getPropertyValue(`--series-${slot}`).trim();
    }

    function firstFreeSlot() {
      const used = new Set(state.selected.values());
      for (let slot = 1; slot <= MAX_SELECTED_SERIES; slot += 1) {
        if (!used.has(slot)) return slot;
      }
      return null;
    }

    function buildTree(names) {
      const tree = { children: new Map(), leaves: 0 };
      for (const fullName of names) {
        let node = tree;
        const parts = fullName.split(".");
        node.leaves += 1;
        for (let index = 0; index < parts.length; index += 1) {
          const segment = parts[index];
          const path = parts.slice(0, index + 1).join(".");
          if (!node.children.has(segment)) {
            node.children.set(segment, {
              segment,
              path,
              children: new Map(),
              leaves: 0,
              isLeaf: false,
            });
          }
          node = node.children.get(segment);
          node.leaves += 1;
          if (index === parts.length - 1) node.isLeaf = true;
        }
      }
      return tree;
    }

    function branchPaths(tree) {
      const paths = new Set();
      function visit(node) {
        for (const child of node.children.values()) {
          if (child.children.size > 0) paths.add(child.path);
          visit(child);
        }
      }
      visit(tree);
      return paths;
    }

    function matchesFilter(node) {
      if (!state.filter) return true;
      if (node.isLeaf && node.path.toLowerCase().includes(state.filter)) return true;
      return [...node.children.values()].some(matchesFilter);
    }

    function renderLeaf(node, depth, capped) {
      const checked = state.selected.has(node.path);
      const label = document.createElement("label");
      label.className = `tree-row leaf-row${checked ? " checked" : ""}${!checked && capped ? " capped" : ""}`;
      label.title = node.path;
      label.style.paddingLeft = `${depth * 14 + 6}px`;

      const input = document.createElement("input");
      input.type = "checkbox";
      input.checked = checked;
      input.disabled = !checked && capped;
      input.addEventListener("change", () => {
        if (input.checked) {
          const slot = firstFreeSlot();
          if (slot === null) {
            input.checked = false;
            return;
          }
          state.selected.set(node.path, slot);
        } else {
          state.selected.delete(node.path);
        }
        renderTree();
        refreshChart();
      });

      const dot = document.createElement("span");
      dot.className = "slot-dot";
      if (checked) {
        const slotColor = color(state.selected.get(node.path));
        dot.style.background = slotColor;
        dot.style.borderColor = slotColor;
      }

      const text = document.createElement("span");
      text.className = "series-name";
      text.textContent = node.segment;
      label.append(input, dot, text);
      listEl.append(label);
    }

    function renderNode(node, depth, capped) {
      if (!matchesFilter(node)) return;
      if (node.children.size === 0) {
        renderLeaf(node, depth, capped);
        return;
      }

      const expanded = Boolean(state.filter) || state.expanded.has(node.path);
      const row = document.createElement("div");
      row.className = "tree-row branch-row";
      row.style.paddingLeft = `${depth * 14 + 6}px`;
      row.title = node.path;
      row.tabIndex = 0;
      row.setAttribute("role", "button");
      row.setAttribute("aria-expanded", String(expanded));

      const disclosure = document.createElement("span");
      disclosure.className = `disclosure${expanded ? " expanded" : ""}`;
      disclosure.textContent = "▸";
      const text = document.createElement("span");
      text.className = "series-name";
      text.textContent = node.segment;
      const count = document.createElement("span");
      count.className = "leaf-count";
      count.textContent = String(node.leaves);
      row.append(disclosure, text, count);

      const toggle = () => {
        if (state.filter) return;
        if (expanded) state.expanded.delete(node.path);
        else state.expanded.add(node.path);
        renderTree();
      };
      row.addEventListener("click", toggle);
      row.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          toggle();
        }
      });
      listEl.append(row);

      if (!expanded) return;
      if (node.isLeaf) renderLeaf(node, depth + 1, capped);
      const children = [...node.children.values()]
        .sort((left, right) => left.segment.localeCompare(right.segment));
      for (const child of children) renderNode(child, depth + 1, capped);
    }

    function renderTree() {
      listEl.replaceChildren();
      const capped = state.selected.size >= MAX_SELECTED_SERIES;
      selectedCountEl.textContent = `${state.selected.size} selected`;
      menuCountEl.textContent = String(state.selected.size);
      menuCountEl.hidden = state.selected.size === 0;
      if (state.tree) {
        const roots = [...state.tree.children.values()]
          .sort((left, right) => left.segment.localeCompare(right.segment));
        for (const node of roots) renderNode(node, 0, capped);
      }
      hintEl.textContent = capped && state.names.length > state.selected.size
        ? `max ${MAX_SELECTED_SERIES} series`
        : "";
    }

    async function refreshSeries() {
      try {
        const response = await fetch("/series", { cache: "no-store" });
        if (!response.ok) throw new Error("series request failed");
        const names = await response.json();
        const firstLoad = !state.seriesLoaded;
        state.seriesLoaded = true;
        state.names = [...names].sort((a, b) => a.localeCompare(b));
        state.tree = buildTree(state.names);

        const currentBranches = branchPaths(state.tree);
        state.expanded = new Set([...state.expanded].filter(path => currentBranches.has(path)));
        if (!state.expansionInitialized && state.names.length > 0) {
          state.expansionInitialized = true;
          if (state.names.length <= 12) {
            for (const node of state.tree.children.values()) {
              if (node.children.size > 0) state.expanded.add(node.path);
            }
          }
        }

        let selectionChanged = false;
        for (const name of [...state.selected.keys()]) {
          if (!state.names.includes(name)) {
            state.selected.delete(name);
            selectionChanged = true;
          }
        }
        if (!state.didAutoSelect && state.names.length > 0) {
          state.selected.set(state.names[0], 1);
          state.didAutoSelect = true;
          selectionChanged = true;
        }

        renderTree();
        if (firstLoad || selectionChanged) refreshChart();
      } catch (error) {
        showMessage("Unable to load series.");
      }
    }

    function showMessage(message, curl = false) {
      if (state.chart) {
        state.chart.destroy();
        state.chart = null;
      }
      chartEl.replaceChildren();
      emptyEl.replaceChildren();
      const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      icon.setAttribute("width", "44");
      icon.setAttribute("height", "24");
      icon.setAttribute("viewBox", "0 0 44 24");
      icon.setAttribute("fill", "none");
      icon.setAttribute("aria-hidden", "true");
      icon.innerHTML = '<path d="M2 18 L10 12 L17 15 L26 5 L33 9 L42 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
      const text = document.createElement("p");
      text.textContent = message;
      emptyEl.append(icon, text);
      if (curl) {
        const command = document.createElement("code");
        command.textContent = `curl -s localhost:9090/ingest -d '{"m":"test","v":42}' -H 'content-type: application/json'`;
        emptyEl.append(command);
      }
      emptyEl.classList.add("visible");
    }

    function yAxisSize(self, values, axisIdx) {
      if (!values) return 44;
      const axis = self.axes[axisIdx];
      self.ctx.save();
      self.ctx.font = axis.font[0];
      const widest = Math.max(...values.map(value => self.ctx.measureText(value).width));
      self.ctx.restore();
      return Math.ceil(widest / devicePixelRatio) + 16;
    }

    function fitChart() {
      if (!state.chart) return;
      const rect = chartEl.getBoundingClientRect();
      const legend = chartEl.querySelector(".u-legend");
      // +4 for the legend's margin-top
      if (legend) state.legendExtra = legend.offsetHeight + 4;
      state.chart.setSize({
        width: Math.max(280, Math.floor(rect.width)),
        height: Math.max(180, Math.floor(rect.height) - (state.legendExtra ?? 0)),
      });
    }

    function buildChart(series, data) {
      if (state.chart) state.chart.destroy();
      chartEl.replaceChildren();
      emptyEl.classList.remove("visible");
      const style = getComputedStyle(root);
      const axis = style.getPropertyValue("--axis-stroke").trim();
      const grid = style.getPropertyValue("--gridlines").trim();
      const muted = style.getPropertyValue("--muted").trim();
      const rect = chartEl.getBoundingClientRect();
      const width = Math.max(280, Math.floor(rect.width));
      const height = Math.max(180, Math.floor(rect.height) - (state.legendExtra ?? 35));

      state.chart = new uPlot({
        width,
        height,
        cursor: { show: true },
        legend: { show: true, live: true, markers: { width: 5 } },
        scales: { x: { time: true }, y: { auto: true } },
        axes: [
          { stroke: muted, space: 80, grid: { show: true, stroke: grid, width: 1 }, ticks: { show: true, stroke: axis, width: 1 }, font: '12px system-ui, -apple-system, "Segoe UI", sans-serif' },
          { stroke: muted, space: 40, grid: { show: true, stroke: grid, width: 1 }, ticks: { show: true, stroke: axis, width: 1 }, font: '12px system-ui, -apple-system, "Segoe UI", sans-serif', size: yAxisSize },
        ],
        series: [
          {},
          ...series.map(({ name, slot }) => ({
            label: name,
            scale: "y",
            stroke: color(slot),
            width: 2,
            points: { show: false },
            fill: null,
            paths: uPlot.paths.stepped({ align: 1 }),
            spanGaps: false,
          })),
        ],
      }, data, chartEl);
      // uPlot applies sizes and legend layout on the next animation frame;
      // measuring the legend before that reads a pre-layout height.
      requestAnimationFrame(() => requestAnimationFrame(fitChart));
    }

    async function refreshChart() {
      const generation = ++state.requestGeneration;
      if (state.names.length === 0) {
        showMessage("No series yet. Push a metric to get started:", true);
        return;
      }

      const series = state.names
        .filter(name => state.selected.has(name))
        .map(name => ({ name, slot: state.selected.get(name) }));
      if (series.length === 0) {
        showMessage("Select a series to graph.");
        return;
      }

      const to = Date.now();
      const from = to - state.rangeMinutes * 60_000;
      const step = Math.max(1000, Math.floor((to - from) / 300));
      try {
        const query = new URLSearchParams({ from: String(from), to: String(to), step: String(step) });
        for (const { name } of series) query.append("m", name);
        const response = await fetch(`/query?${query}`, { cache: "no-store" });
        if (!response.ok) throw new Error("query request failed");
        const result = await response.json();
        if (generation !== state.requestGeneration) return;

        const pointsByName = new Map(result.series.map(item => [item.m, item.points]));
        const chartSeries = series.filter(({ name }) => pointsByName.has(name));
        if (chartSeries.length === 0) {
          showMessage("No matching series.");
          return;
        }
        const orderedPoints = pointsByName.get(chartSeries[0].name);
        const data = [
          orderedPoints.map(([timestamp]) => timestamp / 1000),
          ...chartSeries.map(({ name }) => pointsByName.get(name).map(([, value]) => value)),
        ];
        buildChart(chartSeries, data);
      } catch (error) {
        if (generation === state.requestGeneration) showMessage("Unable to load chart data.");
      }
    }

    document.querySelectorAll(".range").forEach(button => {
      button.addEventListener("click", () => {
        state.rangeMinutes = Number(button.dataset.minutes);
        document.querySelectorAll(".range").forEach(item => item.classList.toggle("active", item === button));
        refreshChart();
      });
    });

    document.querySelector("#theme-toggle").addEventListener("click", () => {
      const isDark = root.dataset.theme
        ? root.dataset.theme === "dark"
        : matchMedia("(prefers-color-scheme: dark)").matches;
      root.dataset.theme = isDark ? "light" : "dark";
      renderTree();
      refreshChart();
    });

    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (!root.dataset.theme) {
        renderTree();
        refreshChart();
      }
    });

    function setDrawer(open) {
      document.body.classList.toggle("drawer-open", open);
      menuBtn.setAttribute("aria-expanded", String(open));
    }

    menuBtn.addEventListener("click", () => {
      setDrawer(!document.body.classList.contains("drawer-open"));
    });
    scrimEl.addEventListener("click", () => setDrawer(false));
    addEventListener("keydown", event => {
      if (event.key === "Escape") setDrawer(false);
    });

    liveBtn.addEventListener("click", () => {
      const on = liveBtn.getAttribute("aria-pressed") !== "true";
      liveBtn.setAttribute("aria-pressed", String(on));
      if (on) refreshChart();
    });

    filterEl.addEventListener("input", () => {
      state.filter = filterEl.value.trim().toLowerCase();
      renderTree();
    });

    new ResizeObserver(fitChart).observe(shellEl);

    setInterval(() => {
      if (liveBtn.getAttribute("aria-pressed") === "true") refreshChart();
    }, 5000);
    setInterval(refreshSeries, 10000);
    refreshSeries();
  </script>
</body>
</html>
